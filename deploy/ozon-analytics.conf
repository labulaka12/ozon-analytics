# Ozon Analytics — Nginx 配置（HTTP + IP 访问模式）
# 部署路径: /etc/nginx/sites-available/ozon-analytics.conf

# 上游后端服务
upstream ozon_backend {
    server 127.0.0.1:8848;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    # 日志
    access_log /var/log/nginx/ozon-analytics-access.log;
    error_log /var/log/nginx/ozon-analytics-error.log;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 前端静态文件 — Vue 构建产物
    location /static/ {
        alias /opt/ozon-analytics/frontend/dist/;
        expires 7d;
        add_header Cache-Control "public, immutable";

        # SPA 路由回退：静态资源不存在时不走 proxy
        location ~* /static/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # favicon
    location /favicon.ico {
        alias /opt/ozon-analytics/frontend/dist/favicon.ico;
        expires 7d;
    }

    # API 和页面路由代理到 Gunicorn
    location / {
        proxy_pass http://ozon_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（预留）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;

        # 请求体上限（CSV 导出预留）
        client_max_body_size 10m;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # 健康检查端点（不记日志）
    location /health {
        proxy_pass http://ozon_backend;
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
